name: spyfall
description: "A spy game where players try to figure out who is the spy among them."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Version information
version: 1.12.1+511

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  dio: ^5.3.3

  # Localization support
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI and icons
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.13.1
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting package for best practices
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Required for localization
  generate: true  

  # Add assets if needed
  assets:
    - assets/images/  # Ensure this directory exists with images inside
    - assets/i18n/    # Translation files

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/spy1.png"
